name: Android checks

on:
  workflow_dispatch:
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "tools/tests/**", ".github/workflows/check.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install native build tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Test, build and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Renderer lifecycle checks
        run: python3 tools/tests/video_renderer_regression.py
